<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pull Request Reviewer icon</title>
  <desc id="desc">A friendly AI reviewer robot above a code diff card, framed by coding brackets and a green approval check.</desc>
  <defs>
    <linearGradient id="bracketBlue" x1="80" y1="120" x2="175" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36D6F5"/><stop offset="1" stop-color="#2463EB"/>
    </linearGradient>
    <linearGradient id="bracketPurple" x1="340" y1="120" x2="430" y2="275" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B65CFF"/><stop offset="1" stop-color="#6537F5"/>
    </linearGradient>
    <linearGradient id="antenna" x1="234" y1="42" x2="278" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D9F8"/><stop offset="1" stop-color="#7A45F5"/>
    </linearGradient>
    <linearGradient id="head" x1="180" y1="94" x2="330" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE7FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="192" y1="142" x2="324" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14264A"/><stop offset="1" stop-color="#080F22"/>
    </linearGradient>
    <linearGradient id="card" x1="115" y1="230" x2="390" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D8E4FF"/>
    </linearGradient>
    <linearGradient id="check" x1="365" y1="178" x2="440" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5AF2B0"/><stop offset="1" stop-color="#19BF7A"/>
    </linearGradient>
    <filter id="shadow" x="55" y="40" width="410" height="430" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Coding brackets -->
  <path d="M150 111 81 184 150 257" stroke="url(#bracketBlue)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M362 111 431 184 362 257" stroke="url(#bracketPurple)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Soft ground shadow -->
  <ellipse cx="256" cy="430" rx="142" ry="18" fill="#020617" opacity=".25" filter="url(#shadow)"/>

  <!-- Pull request / diff panel -->
  <rect x="92" y="222" width="328" height="208" rx="27" fill="#071329"/>
  <rect x="101" y="231" width="310" height="190" rx="20" fill="url(#card)"/>
  <path d="M101 251Q101 231 121 231H391Q411 231 411 251V270H101V251Z" fill="#EEF3FF"/>
  <circle cx="126" cy="250" r="6.5" fill="#FB5B65"/>
  <circle cx="147" cy="250" r="6.5" fill="#FFB52E"/>
  <circle cx="168" cy="250" r="6.5" fill="#27C982"/>
  <path d="M121 290H203" stroke="#8B9AB8" stroke-width="10" stroke-linecap="round"/>
  <path d="M121 315H234" stroke="#A3B0CB" stroke-width="10" stroke-linecap="round"/>
  <rect x="118" y="334" width="100" height="17" rx="8.5" fill="#FFE3E5"/>
  <path d="M128 342H140" stroke="#F25C68" stroke-width="5" stroke-linecap="round"/>
  <path d="M151 342H202" stroke="#F25C68" stroke-width="7" stroke-linecap="round"/>
  <rect x="118" y="362" width="151" height="17" rx="8.5" fill="#DDF9EB"/>
  <path d="M128 370H140" stroke="#1CBF7A" stroke-width="5" stroke-linecap="round"/>
  <path d="M151 370H249" stroke="#1CBF7A" stroke-width="7" stroke-linecap="round"/>
  <path d="M121 397H207" stroke="#A3B0CB" stroke-width="10" stroke-linecap="round"/>

  <!-- Robot side pods -->
  <rect x="161" y="115" width="28" height="68" rx="14" fill="#2463EB"/>
  <rect x="323" y="115" width="28" height="68" rx="14" fill="#2463EB"/>
  <rect x="168" y="121" width="9" height="52" rx="4.5" fill="#51D7F8" opacity=".9"/>
  <rect x="334" y="121" width="9" height="52" rx="4.5" fill="#51D7F8" opacity=".9"/>

  <!-- Antenna -->
  <rect x="249" y="57" width="14" height="49" rx="7" fill="url(#antenna)"/>
  <circle cx="256" cy="48" r="23" fill="url(#antenna)"/>
  <circle cx="256" cy="48" r="8" fill="#FFFFFF" opacity=".32"/>

  <!-- Robot head -->
  <rect x="169" y="91" width="174" height="143" rx="57" fill="#071329"/>
  <rect x="176" y="96" width="160" height="130" rx="52" fill="url(#head)"/>
  <rect x="190" y="126" width="132" height="78" rx="29" fill="url(#screen)"/>
  <!-- Friendly eyes -->
  <path d="M211 164C217 151 234 151 240 164" stroke="#41D5F6" stroke-width="8" stroke-linecap="round"/>
  <path d="M270 164C276 151 293 151 299 164" stroke="#41D5F6" stroke-width="8" stroke-linecap="round"/>
  <path d="M235 184Q256 200 277 184" stroke="#85F3CA" stroke-width="6" stroke-linecap="round"/>

  <!-- Approval bubble -->
  <path d="M359 170C359 148 377 130 399 130C421 130 439 148 439 170C439 192 421 210 399 210H390L377 221L379 204C367 197 359 184 359 170Z" fill="url(#check)" stroke="#071329" stroke-width="7" stroke-linejoin="round"/>
  <path d="M382 170L394 182L417 157" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
